# Left half (central) only: these nice_oled options exist only on the central side

# WPM: speedometer and number, no character (the module enables Bongo Cat by default)
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=y
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y

# Modifier indicators as letters (C/S/A/G) instead of icons
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_LETTER=y
